[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cruise-attribution-xai"
version = "0.1.0"
description = "Auditable comparison of rule-based and contextual BERT cruise-review destination attribution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pandas>=2.1,<3.0", "numpy>=1.26,<3.0", "scikit-learn>=1.4,<2.0", "matplotlib>=3.8,<4.0",
  "PyYAML>=6.0,<7.0", "torch>=2.2,<3.0", "transformers==4.46.3", "captum>=0.7,<1.0"
]

[project.optional-dependencies]
sentiment = ["vaderSentiment>=3.3,<4.0"]
legacy = ["spacy>=3.7,<4.0", "ftfy>=6.1,<7.0", "vaderSentiment>=3.3,<4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
